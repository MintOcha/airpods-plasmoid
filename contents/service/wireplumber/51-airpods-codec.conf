# AirPods only offer SBC and AAC over A2DP. Prefer AAC at its highest variable-bitrate quality, fall back to SBC-XQ.
monitor.bluez.properties = {
    bluez5.codecs = [ aac sbc_xq sbc ]
    bluez5.enable-sbc-xq = true
}

monitor.bluez.rules = [
    {
        matches = [ { device.name = "~bluez_card.*" } ]
        actions = { update-props = { bluez5.a2dp.aac.bitratemode = 5 } }
    }
]
